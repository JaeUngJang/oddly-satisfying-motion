# WowPort4 — iOS 17.0, pure SwiftUI, **Swift 6 language mode** with strict concurrency. Proves the
# units compile in a brand-new Xcode project without the user downgrading to Swift 5 mode.
name: WowPort4

options:
  bundleIdPrefix: dev.wowunits
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"          # Swift 6 language mode: strict concurrency is the point of this host
    SWIFT_STRICT_CONCURRENCY: complete
    # Simulator-only build: never signed, so no team and no provisioning profile are needed.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  WowPort4:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wowunits.port4
        PRODUCT_NAME: WowPort4
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WowPort4
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
