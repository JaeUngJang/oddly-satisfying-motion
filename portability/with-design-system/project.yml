# WowPort3 — iOS 17.0, pure SwiftUI, host owns its own DesignSystem.swift (tokens + a
# PrimaryButtonStyle). Proves units adopt the host's tokens via their own parameters
# (scale:/tint:) without any edits to unit source.
name: WowPort3

options:
  bundleIdPrefix: dev.wowunits
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"          # units use static mutable state (WowSettings/WowProbe); Swift 6 mode would reject it
    # Simulator-only build: never signed, so no team and no provisioning profile are needed.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  WowPort3:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wowunits.port3
        PRODUCT_NAME: WowPort3
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WowPort3
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
